<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AI Growth Copilot Demo</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; max-width: 1100px; }
    textarea, input { width: 100%; margin: 6px 0; }
    textarea { min-height: 90px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    pre { background: #f5f5f5; padding: 12px; overflow: auto; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 12px; }
  </style>
</head>
<body>
  <h1>AI Growth Copilot: Lead Scoring + Follow-up</h1>
  <p>Skill: <b>lead-scoring-followup</b> | Tool: <b>query_product</b></p>

  <label>Sample lead</label>
  <select id="sampleSelect"></select>
  <button onclick="loadSample()">Load sample</button>

  <div class="grid">
    <div class="card">
      <h3>Lead Context</h3>
      <input id="source" placeholder="Source" />
      <input id="company" placeholder="Company" />
      <input id="industry" placeholder="Industry" />
      <input id="product" placeholder="Product of interest" />
      <textarea id="message" placeholder="Customer message"></textarea>
      <textarea id="note" placeholder="Sales note"></textarea>
      <button onclick="analyzeLead()">Run Copilot</button>
    </div>

    <div class="card">
      <h3>Analysis Result</h3>
      <pre id="analysis"></pre>
    </div>
  </div>

  <h3>Execution Trace</h3>
  <pre id="trace"></pre>

<script>
const sampleLeads = {{ leads | tojson }};
const select = document.getElementById('sampleSelect');
sampleLeads.forEach((l, i) => {
  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = `${l.company} (${l.source})`;
  select.appendChild(opt);
});

function loadSample() {
  const l = sampleLeads[select.value || 0];
  document.getElementById('source').value = l.source || '';
  document.getElementById('company').value = l.company || '';
  document.getElementById('industry').value = l.industry || '';
  document.getElementById('product').value = l.product_of_interest || '';
  document.getElementById('message').value = l.customer_message || '';
  document.getElementById('note').value = l.sales_note || '';
}
loadSample();

async function analyzeLead() {
  const payload = {
    source: document.getElementById('source').value,
    company: document.getElementById('company').value,
    industry: document.getElementById('industry').value,
    product_of_interest: document.getElementById('product').value,
    customer_message: document.getElementById('message').value,
    sales_note: document.getElementById('note').value,
  };

  const res = await fetch('/analyze', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  });
  const data = await res.json();
  document.getElementById('analysis').textContent = data.result.analysis_markdown;
  document.getElementById('trace').textContent = JSON.stringify(data.trace, null, 2);
}
</script>
</body>
</html>
